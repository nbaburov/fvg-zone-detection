# xlstm_g1.yaml — Untuned baseline HP for xLSTM (sLSTM-only stack) on ValidFVG target.
# No Optuna tuning yet (G1 sweep pending). Apple-Silicon safe: backend="vanilla" in model.
# Optimiser: Adam (matches LSTM/CNN-LSTM baseline convention).
name: xlstm_g1_validfvg
data:
  labeller: fvg_valid
  window_size: 60
model:
  arch: xlstm
  embedding_dim: 64
  num_blocks: 2
  num_heads: 4
  dropout: 0.1
  head_dropout: 0.3
train:
  seeds: [0, 17, 42, 123, 2024]
  batch_size: 16
  lr: 0.001
  weight_decay: 0.0001
  optimizer: adam
  scheduler: none
  max_epochs: 100
  patience: 15
  loss: weighted_ce
  device: cpu
