# cnn_lstm_multisym.yaml — CNN-LSTM multi-symbol retrain (Phase 4).
# HP identical to cnn_lstm_g1.yaml (G1 Optuna best HP, val F1 0.6440).
# Only change: data.data_dir points to the pooled multi-symbol splits produced
# by build_multi_symbol_pipeline(["SPY", "QQQ", "IWM", "DIA"]).
# Run via: python scripts/rigor/multiseed_run.py --model cnn_lstm --config experiments/cnn_lstm_multisym.yaml
name: cnn_lstm_multisym_validfvg
data:
  data_dir: data/processed/multisym
  labeller: fvg_valid
  window_size: 60
model:
  arch: cnn_lstm
  n_conv_layers: 2
  conv_filters: 16
  kernel_size: 5
  use_pool: false
  pool_type: "max"
  lstm_hidden: 32
  lstm_layers: 2
  dropout: 0.2217
  head_dropout: 0.3624
train:
  seeds: [0, 17, 42, 123, 2024]
  batch_size: 16
  lr: 0.000731
  weight_decay: 7.476e-06
  optimizer: adam
  scheduler: none
  max_epochs: 100
  patience: 15
  loss: weighted_ce
  device: cpu
