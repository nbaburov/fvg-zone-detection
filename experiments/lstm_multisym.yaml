# lstm_multisym.yaml — LSTM multi-symbol retrain (Phase 4).
# HP identical to lstm_g1.yaml (G1 Optuna best HP, val F1 0.6373).
# Only change: data.data_dir points to the pooled multi-symbol splits produced
# by build_multi_symbol_pipeline(["SPY", "QQQ", "IWM", "DIA"]).
# Run via: python scripts/rigor/multiseed_run.py --model lstm --config experiments/lstm_multisym.yaml
name: lstm_multisym_validfvg
data:
  data_dir: data/processed/multisym
  labeller: fvg_valid
  window_size: 60
model:
  arch: lstm
  hidden_size: 128
  num_layers: 1
  dropout: 0.31753016617848756
  head_dropout: 0.526205942764976
train:
  seeds: [0, 17, 42, 123, 2024]
  batch_size: 16
  lr: 5.301506411688119e-04
  weight_decay: 3.9155649921300636e-05
  optimizer: adam
  scheduler: none
  max_epochs: 100
  patience: 15
  loss: weighted_ce
  device: cpu
