# lstm_5m.yaml — LSTM on 5-minute bars (WS-5 timeframe-parametric plumbing).
# HP identical to lstm_g1.yaml (G1 Optuna best HP, val macro-F1 0.6373 on H1).
# Only change: data.timeframe = "5m" routes build_pipeline to spy_5m_*.parquet
# and checkpoints to checkpoints/lstm_5m/.
# NOTE: window_size left at 60 (H1 default). WS-7b sweep will determine the
# optimal window for 5m bars — override with --set data.window_size=<N> at that point.
name: lstm_5m_validfvg
data:
  labeller: fvg_valid
  data_dir: data/processed
  timeframe: "5m"
  dataset: multisym
  window_size: 60  # WS-7b sweep will decide — placeholder
  stride: 9  # 5m has ~12× more bars than H1; stride=9 yields ~H1-multisym-scale window count (bars/window_size is stride-invariant, so data-bound experiment stays valid)
model:
  arch: lstm
  hidden_size: 128
  num_layers: 1
  dropout: 0.31753016617848756
  head_dropout: 0.526205942764976
train:
  seeds: [0, 17, 42, 123, 2024]
  batch_size: 16
  lr: 5.301506411688119e-04
  weight_decay: 3.9155649921300636e-05
  optimizer: adam
  scheduler: none
  max_epochs: 100
  patience: 15
  loss: weighted_ce
  device: cpu
