# cnn_lstm_g1_nodrop.yaml — G1 HP with dropout zeroed for squeeze experiment.
# Base: experiments/cnn_lstm_g1.yaml (dropout=0.2217, head_dropout=0.3624 → 0.0 each)
# Hypothesis: 29k-param model may be over-regularized; test no-dropout lift.
name: cnn_lstm_g1_nodrop
data:
  labeller: fvg_valid
  window_size: 60
model:
  arch: cnn_lstm
  n_conv_layers: 2
  conv_filters: 16
  kernel_size: 5
  use_pool: false
  pool_type: "max"
  lstm_hidden: 32
  lstm_layers: 2
  dropout: 0.0
  head_dropout: 0.0
train:
  seeds: [0, 17, 42, 123, 2024]
  batch_size: 16
  lr: 0.000731
  weight_decay: 7.476e-06
  optimizer: adam
  scheduler: none
  max_epochs: 100
  patience: 15
  loss: weighted_ce
  device: cpu
