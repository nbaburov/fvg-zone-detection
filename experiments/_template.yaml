# _template.yaml — Every config field with inline documentation.
# Copy this file to experiments/<name>.yaml and remove fields you don't need to override.
# Fields not set here will inherit from _base.yaml.

name: my_experiment          # Unique experiment identifier. Used in report filenames.

data:
  data_dir: data/processed   # Directory containing spy_h1_{train,val,test}.parquet + class_weights*.json
  labeller: fvg_valid        # Target label scheme: "fvg" (raw geometric) | "fvg_valid" (6-criteria valid FVG)
  splits: default            # "default": use pre-split parquets | "legacy": re-split from spy_h1_labeled.parquet
                             # | any path to a directory containing spy_h1_{train,val,test}.parquet
  window_size: 60            # Lookback window in bars (60 = 60 H1 bars ≈ 3 weeks of RTH)
  stride: 1                  # Window stride for train set (1 = maximum overlap; effective sample size ~117)
  drop_cross_session: false  # Drop windows that span overnight gaps (reserved for future use)

model:
  arch: lstm                 # REQUIRED. Discriminator field: "lstm" | "xgb" | "cnn_lstm" (future)

  # LSTM-specific fields (ignored when arch=xgb)
  hidden_size: 128           # LSTM hidden dimension
  num_layers: 1              # Number of stacked LSTM layers (>1 enables inter-layer dropout)
  dropout: 0.318             # LSTM inter-layer dropout (only active when num_layers > 1)
  head_dropout: 0.526        # Classifier head dropout (applied after final hidden state)

  # XGBoost-specific fields (ignored when arch=lstm)
  n_estimators: 513          # Number of boosting rounds
  max_depth: 4               # Maximum tree depth
  learning_rate: 0.131       # XGBoost learning rate (eta)
  min_child_weight: 1        # Minimum sum of instance weight in a child
  subsample: 0.826           # Subsample ratio of training instances per tree
  colsample_bytree: 0.725    # Subsample ratio of columns per tree

train:
  seeds: [42]                # Random seeds for multi-seed sweep. Single value = single run.
  batch_size: 32             # Training batch size (LSTM only; XGBoost ignores)
  batch_eval: 256            # Evaluation batch size (LSTM only)
  lr: 1.0e-3                 # Learning rate (LSTM only)
  weight_decay: 1.0e-4       # L2 regularisation weight (LSTM only; XGBoost has its own reg)
  optimizer: adam            # LSTM optimiser: "adam" | "adamw". G1 HP tuned under Adam — keep Adam.
  scheduler: none            # LR scheduler: "none" | "onecycle". OneCycleLR not recommended with G1 HP.
  max_epochs: 100            # Maximum training epochs (LSTM only)
  patience: 15               # EarlyStop patience in epochs (LSTM only)
  ema_alpha: 0.3             # EMA smoothing for val macro-F1 in EarlyStop (LSTM only)
  max_grad_norm: 1.0         # Gradient clipping norm (LSTM only)
  loss: weighted_ce          # Loss function: "weighted_ce" | "focal"
  focal_gamma: 2.0           # Focal loss gamma (only used when loss=focal)
  device: cpu                # Training device: "cpu" | "auto" | "mps" | "cuda"
                             # LSTM is CPU-only on Apple Silicon (MPS deadlock, see CLAUDE.md)
  ablation_no_dropout: false # Ablation: set all dropout to 0 during training
  ablation_no_l2: false      # Ablation: set weight_decay to 0 during training

eval:
  lookahead_bars: 20         # Bars to look ahead when inspecting model predictions
  bootstrap_n_iter: 1000     # Bootstrap iterations for confidence intervals
  bootstrap_block_size: 60   # Block size for block bootstrap (preserves temporal autocorrelation)

runtime:
  output_dir: reports/rigor  # Base directory for run reports and metrics output
  checkpoint_dir: checkpoints  # Base directory for saved model checkpoints
  n_jobs: -1                 # Parallelism (-1 = all CPUs; 1 = serial; for rigor scripts)
