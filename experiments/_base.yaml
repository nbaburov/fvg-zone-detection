# _base.yaml — Default values inherited by all experiments.
# Explicit experiment YAMLs override only the fields they change.
name: base
data:
  data_dir: data/processed
  labeller: fvg_valid           # "fvg" | "fvg_valid"
  splits: default               # "default" | "legacy" | path/to/dir
  window_size: 60
  stride: 1
  drop_cross_session: false
model:
  arch: lstm                    # discriminator field — sets model class
train:
  seeds: [42]
  batch_size: 32
  batch_eval: 256
  lr: 1.0e-3
  weight_decay: 1.0e-4
  optimizer: adam               # "adam" | "adamw"
  scheduler: none               # "none" | "onecycle"
  max_epochs: 100
  patience: 15
  ema_alpha: 0.3
  max_grad_norm: 1.0
  loss: weighted_ce             # "weighted_ce" | "focal"
  focal_gamma: 2.0
  device: cpu
  ablation_no_dropout: false
  ablation_no_l2: false
eval:
  lookahead_bars: 20
  bootstrap_n_iter: 1000
  bootstrap_block_size: 60
runtime:
  output_dir: reports/rigor
  checkpoint_dir: checkpoints
  n_jobs: -1
