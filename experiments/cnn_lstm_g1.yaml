# cnn_lstm_g1.yaml — G1 Optuna best HP for CNN-LSTM on ValidFVG target.
# HP source: reports/rigor/2026-05-13/cnn_lstm_G1/best_hp_cnn_lstm.json
# G1 best val F1: 0.6440 (trial 0, 6/12 trials completed before 60min cap)
name: cnn_lstm_g1_validfvg
data:
  labeller: fvg_valid
  window_size: 60
model:
  arch: cnn_lstm
  n_conv_layers: 2
  conv_filters: 16
  kernel_size: 5
  use_pool: false
  pool_type: "max"
  lstm_hidden: 32
  lstm_layers: 2
  dropout: 0.2217
  head_dropout: 0.3624
train:
  seeds: [0, 17, 42, 123, 2024]
  batch_size: 16
  lr: 0.000731
  weight_decay: 7.476e-06
  optimizer: adam
  scheduler: none
  max_epochs: 100
  patience: 15
  loss: weighted_ce
  device: cpu
