# xgb_g1_rawfvg.yaml — G1 XGBoost HP on raw FVG target (comparison baseline).
# Same HP as xgb_g1.yaml but labeller=fvg (raw geometric FVG, no validity criteria).
name: xgb_g1_rawfvg
data:
  labeller: fvg
  window_size: 60
model:
  arch: xgb
  n_estimators: 513
  max_depth: 4
  learning_rate: 0.1311447837531049
  min_child_weight: 1
  subsample: 0.826439213403869
  colsample_bytree: 0.7249466284356196
train:
  seeds: [0, 17, 42, 123, 2024]
  device: cpu
