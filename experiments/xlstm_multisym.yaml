# xlstm_multisym.yaml — xLSTM multi-symbol retrain (Phase 4, completeness).
# HP identical to xlstm_g1.yaml (untuned baseline). Only change: data.data_dir
# points at the pooled multi-symbol splits. xLSTM was excluded from the headline
# Phase-4 lever (underfits train, F1 0.33-0.40 — more data is not its lever), but
# trained here on the same footing so all 5 archs are inspectable/comparable.
# Apple-Silicon safe: backend="vanilla" baked into the model.
# Run: python scripts/rigor/multiseed_run.py --model xlstm --config experiments/xlstm_multisym.yaml
name: xlstm_multisym_validfvg
data:
  labeller: fvg_valid
  window_size: 60
  data_dir: data/processed/multisym
model:
  arch: xlstm
  embedding_dim: 64
  num_blocks: 2
  num_heads: 4
  dropout: 0.1
  head_dropout: 0.3
train:
  seeds: [0, 17, 42, 123, 2024]
  batch_size: 16
  lr: 0.001
  weight_decay: 0.0001
  optimizer: adam
  scheduler: none
  max_epochs: 100
  patience: 15
  loss: weighted_ce
  device: cpu
